
<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon DVD Player</title>
    <!-- Generated Neon Vinyl Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23030712' stroke='%2300f3ff' stroke-width='4' /%3E%3Ccircle cx='32' cy='32' r='8' fill='%23bc13fe' /%3E%3Cpath d='M32 8 A 24 24 0 0 1 56 32' fill='none' stroke='%2300f3ff' stroke-width='2' opacity='0.5' stroke-linecap='round' /%3E%3C/svg%3E" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              neon: {
                blue: '#00f3ff',
                pink: '#ff00ff',
                green: '#00ff00',
                purple: '#bc13fe',
                yellow: '#f9f871',
              },
              theme: {
                primary: 'var(--color-primary)',
                secondary: 'var(--color-secondary)',
                accent: 'var(--color-accent)',
                bg: 'var(--color-bg)',
                panel: 'var(--color-panel)',
                text: 'var(--color-text)',
                muted: 'var(--color-muted)',
                border: 'var(--color-border)',
                toggleKnob: 'var(--color-toggle-knob)',
              }
            },
            boxShadow: {
              'neon-blue': '0 0 10px #00f3ff, 0 0 20px #00f3ff',
              'neon-pink': '0 0 10px #ff00ff, 0 0 20px #ff00ff',
              'neon-green': '0 0 10px #00ff00, 0 0 20px #00ff00',
              'neon-yellow': '0 0 10px #f9f871, 0 0 20px #f9f871',
              'screen': 'inset 0 0 20px rgba(0,0,0,0.5)',
              'theme-glow': '0 0 10px var(--color-primary), 0 0 20px var(--color-primary)',
              'theme-glow-sec': '0 0 10px var(--color-secondary), 0 0 20px var(--color-secondary)',
            },
            fontFamily: {
              mono: ['Courier New', 'Courier', 'monospace'],
            },
            animation: {
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'spin-slow': 'spin 3s linear infinite',
              'marquee': 'marquee 10s linear infinite',
              'slide-in-right': 'slideInRight 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(100%)' },
                '100%': { transform: 'translateX(-100%)' },
              },
              slideInRight: {
                '0%': { transform: 'translateX(100%)', opacity: '0' },
                '100%': { transform: 'translateX(0)', opacity: '1' },
              }
            }
          },
        },
      }
    </script>
    <style>
        /* Force no scrolling on the body to ensure the app handles layout */
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }
        /* Fallback CSS Variables */
        :root {
          --color-primary: #00f3ff;
          --color-secondary: #bc13fe;
          --color-accent: #00ff00;
          --color-bg: #030712;
          --color-panel: #111827;
          --color-text: #ffffff;
          --color-muted: #9ca3af;
          --color-border: #374151;
          --color-toggle-knob: #ffffff;
        }
    </style>
